# Entorno local de desarrollo: docker compose up -d  (o podman-compose up -d)
# Puertos ligados a 127.0.0.1: la API de Kubo (5001) permite administrar el nodo y no debe exponerse.
services:
  postgres:
    image: docker.io/library/postgres:16.15-alpine
    environment:
      POSTGRES_DB: libroabierto
      POSTGRES_USER: libroabierto
      # Clave solo de desarrollo, la misma que el valor por defecto de DB_PASSWORD en application.yml. Va literal:
      # podman-compose 1.3 no expande ${VAR:-defecto} acá y dejaba ese texto como contraseña.
      POSTGRES_PASSWORD: libroabierto-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ipfs:
    image: docker.io/ipfs/kubo:v0.43.1
    ports:
      - "127.0.0.1:5001:5001"   # API (publicación desde el backend)
      - "127.0.0.1:8080:8080"   # Gateway (lectura desde el frontend)
    volumes:
      - ipfs-data:/data/ipfs

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.9.0
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "127.0.0.1:8545:8545"

  # HU-06: modelo local para detectar nombres de personas antes de publicar. Va en un perfil aparte porque necesita
  # cerca de 1,5 GB de RAM: `docker compose --profile pii up -d` y, la primera vez,
  # `docker compose exec ollama ollama pull qwen2.5:1.5b`. Sin él, la revisión usa solo patrones y pide confirmar.
  ollama:
    image: docker.io/ollama/ollama:0.5.7
    profiles: ["pii"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ipfs-data:
  ollama-data:
