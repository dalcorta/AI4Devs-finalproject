# Cada contexto de Spring de los tests levanta su propio PostgreSQL en Testcontainers. Con la caché por defecto
# (32 contextos) quedan todos vivos a la vez y la suite se queda sin memoria en una máquina de 4 GB.
# Con 2, al cerrarse un contexto viejo también se detiene su contenedor.
spring.test.context.cache.maxSize=2
