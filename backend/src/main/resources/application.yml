server:
  # 8080 lo usa el gateway de Kubo (compose.yaml), que lee el frontend.
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: libroabierto-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/libroabierto}
    username: ${DB_USER:libroabierto}
    password: ${DB_PASSWORD:libroabierto-dev}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo verifica que las entidades coincidan.
      ddl-auto: validate

libroabierto:
  ipfs:
    api-url: ${IPFS_API_URL:http://127.0.0.1:5001}
  blockchain:
    rpc-url: ${RPC_URL:http://127.0.0.1:8545}
    chain-id: ${CHAIN_ID:31337}
    contrato: ${CONTRACT_ADDRESS:}
    # Sin valor por defecto a propósito: la clave del relayer nunca vive en el repositorio.
    relayer-private-key: ${RELAYER_PRIVATE_KEY:}
    # Clave institucional del funcionario (OFFICER_ROLE), distinta de la del relayer; tampoco tiene valor por defecto.
    officer-private-key: ${OFFICER_PRIVATE_KEY:}
  worker:
    habilitado: ${WORKER_HABILITADO:true}
    intervalo: ${WORKER_INTERVALO:PT10S}
  listener:
    habilitado: ${LISTENER_HABILITADO:true}
    intervalo: ${LISTENER_INTERVALO:PT5S}
    # Bloque del despliegue del contrato: evita recorrer la cadena desde el génesis la primera vez.
    bloque-inicial: ${LISTENER_BLOQUE_INICIAL:0}
    confirmaciones: ${LISTENER_CONFIRMACIONES:0}
    max-bloques-por-lote: ${LISTENER_MAX_BLOQUES_POR_LOTE:2000}
  triage:
    habilitado: ${TRIAGE_HABILITADO:true}
    intervalo: ${TRIAGE_INTERVALO:PT10S}
    modelo: ${TRIAGE_MODELO:claude-opus-5-5}
    lote: ${TRIAGE_LOTE:10}
    # Sin valor por defecto a propósito: con el triage habilitado, sin clave la aplicación no arranca.
    api-key: ${ANTHROPIC_API_KEY:}
  privacidad:
    # HU-06: el texto todavía no es público, así que el modelo es siempre local (Ollama). Con una URL fuera de la
    # máquina o de la red privada la aplicación no arranca. Sin modelo, el autor confirma cada publicación.
    llm-habilitado: ${PII_LLM_HABILITADO:true}
    ollama-url: ${PII_OLLAMA_URL:http://127.0.0.1:11434}
    modelo: ${PII_MODELO:qwen2.5:1.5b}
    timeout: ${PII_TIMEOUT:PT20S}
  auth:
    # Sin valor por defecto a propósito: sin JWT_SECRET (32 bytes o más) la aplicación no arranca.
    jwt-secret: ${JWT_SECRET:}
    duracion-token: ${JWT_DURACION:PT1H}
