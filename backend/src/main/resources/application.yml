spring:
  application:
    name: libroabierto-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/libroabierto}
    username: ${DB_USER:libroabierto}
    password: ${DB_PASSWORD:libroabierto-dev}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo verifica que las entidades coincidan.
      ddl-auto: validate

libroabierto:
  ipfs:
    api-url: ${IPFS_API_URL:http://127.0.0.1:5001}
  blockchain:
    rpc-url: ${RPC_URL:http://127.0.0.1:8545}
    chain-id: ${CHAIN_ID:31337}
    contrato: ${CONTRACT_ADDRESS:}
    # Sin valor por defecto a propósito: la clave del relayer nunca vive en el repositorio.
    relayer-private-key: ${RELAYER_PRIVATE_KEY:}
  worker:
    habilitado: ${WORKER_HABILITADO:true}
    intervalo: ${WORKER_INTERVALO:PT10S}
